name: Bernini bridge tests
on:
  push:
    branches: [feat/r2-comfy-bridge]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q r2_bridge.py tests
      - run: python -m unittest discover -s tests -v
